<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yamaha PSR-SX / Genos Arranger Workstation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #161f33 0%, #07090f 85%);
      font-family: Tahoma, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f1f5f9;
    }

    /* پنل کنسول ارگ یاماها در بالای صفحه */
    .yamaha-console {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 97vw;
      max-width: 1220px;
      background: linear-gradient(180deg, #1e2536 0%, #111622 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom: 3px solid #f59e0b;
      border-radius: 14px;
      padding: 8px 12px;
      z-index: 100;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-badge {
      display: flex;
      flex-direction: column;
      padding-left: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
    }

    .brand-title {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fbbf24;
      text-transform: uppercase;
    }

    .brand-sub {
      font-size: 9px;
      color: #94a3b8;
      letter-spacing: 0.5px;
    }

    /* صفحه نمایشگر LCD وسط ارگ */
    .lcd-screen {
      background: linear-gradient(180deg, #061826 0%, #030d17 100%);
      border: 1px solid #0284c7;
      box-shadow: inset 0 0 18px rgba(14, 165, 233, 0.25);
      border-radius: 8px;
      padding: 5px 12px;
      min-width: 230px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      direction: ltr;
    }

    .lcd-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #38bdf8;
      font-family: monospace;
    }

    .lcd-main {
      font-size: 12px;
      font-weight: bold;
      color: #e0f2fe;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lcd-bottom {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #fbbf24;
      font-family: monospace;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .group-label {
      font-size: 11px;
      color: #94a3b8;
    }

    select.y-select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    select.y-select.gold {
      border-color: rgba(245, 158, 11, 0.55);
      color: #fde68a;
    }

    select.y-select.cyan {
      border-color: rgba(56, 189, 248, 0.55);
      color: #bae6fd;
    }

    .y-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.14s;
      white-space: nowrap;
    }

    .y-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .y-btn.play-song {
      background: rgba(16, 185, 129, 0.22);
      border-color: #10b981;
      color: #6ee7b7;
    }

    .y-btn.play-song.playing {
      background: rgba(239, 68, 68, 0.28);
      border-color: #ef4444;
      color: #fca5a5;
    }

    .y-btn.rhythm-btn.active {
      background: rgba(245, 158, 11, 0.28);
      border-color: #f59e0b;
      color: #fde68a;
    }

    .y-btn.fill-btn {
      background: rgba(168, 85, 247, 0.22);
      border-color: #a855f7;
      color: #e9d5ff;
    }

    .y-btn.active-blue {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
      color: #7dd3fc;
    }

    .slider-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.28);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      color: #cbd5e1;
    }

    .slider-box input[type="range"] {
      width: 62px;
      accent-color: #f59e0b;
      cursor: pointer;
    }

    /* بوم گرافیکی سیم‌ها، درام، گوی‌های متحرک و دفتر نت */
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* کیبورد ۲۲ کلاویه‌ای ارگ یاماها */
    .piano-wrapper {
      position: fixed;
      bottom: 148px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 10px 14px 6px;
      background: linear-gradient(180deg, #222938 0%, #0d1017 100%);
      border-top: 4px solid #b91c1c;
      border-radius: 10px 10px 12px 12px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.82), 0 0 0 1px rgba(255, 255, 255, 0.1);
      direction: ltr;
    }

    .piano-keys {
      position: relative;
      display: flex;
      height: 158px;
      user-select: none;
    }

    .key-white {
      position: relative;
      width: 48px;
      height: 158px;
      margin: 0 1px;
      background: linear-gradient(180deg, #e2e8f0 0%, #ffffff 92%, #cbd5e1 100%);
      border: 1px solid #475569;
      border-radius: 0 0 7px 7px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8px;
      box-shadow: inset 0 -5px 0 rgba(15, 23, 42, 0.15), 0 4px 8px rgba(0, 0, 0, 0.4);
      transition: transform 0.04s ease, background 0.05s ease;
    }

    .key-white.playing {
      transform: translateY(5px);
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 100%);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.9);
    }

    .key-white.auto-playing {
      transform: translateY(5px);
      background: linear-gradient(180deg, #6ee7b7 0%, #10b981 100%);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.95);
    }

    .key-white .k-shortcut {
      font-size: 11px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 2px;
      pointer-events: none;
    }

    .key-white .k-note {
      font-size: 9.5px;
      font-weight: 600;
      color: #64748b;
      pointer-events: none;
    }

    .key-black {
      position: absolute;
      top: 0;
      width: 30px;
      height: 98px;
      background: linear-gradient(180deg, #334155 0%, #0f172a 85%, #020617 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-top: none;
      border-radius: 0 0 5px 5px;
      z-index: 10;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8px;
      box-shadow: inset 0 -4px 0 rgba(255, 255, 255, 0.08), 0 6px 12px rgba(0, 0, 0, 0.65);
      transition: transform 0.04s ease, background 0.05s ease;
    }

    .key-black.playing {
      transform: translateY(4px);
      background: linear-gradient(180deg, #7dd3fc 0%, #0284c7 100%);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.95);
    }

    .key-black.auto-playing {
      transform: translateY(4px);
      background: linear-gradient(180deg, #6ee7b7 0%, #059669 100%);
      box-shadow: 0 0 22px rgba(16, 185, 129, 0.95);
    }

    .key-black .k-shortcut {
      font-size: 10px;
      font-weight: 700;
      color: #e2e8f0;
      pointer-events: none;
    }

    .key-black .k-note {
      font-size: 8.5px;
      color: #94a3b8;
      pointer-events: none;
    }

    @media (max-width: 780px) {
      .key-white { width: 32px; height: 128px; }
      .key-black { width: 20px; height: 78px; }
      .lcd-screen { min-width: 175px; }
    }
  </style>
</head>
<body>

  <!-- پنل کنسول ارگ حرفه‌ای یاماها -->
  <div class="yamaha-console">
    <div class="brand-badge">
      <span class="brand-title">YAMAHA GENOS</span>
      <span class="brand-sub">ARRANGER WORKSTATION</span>
    </div>

    <!-- نمایشگر دیجیتال LCD -->
    <div class="lcd-screen">
      <div class="lcd-top">
        <span id="lcdVoice">VOICE: CFX Grand</span>
        <span id="lcdTempo">TEMPO: 115</span>
      </div>
      <div class="lcd-main" id="lcdStatus">READY - SELECT A SONG OR PLAY</div>
      <div class="lcd-bottom">
        <span id="lcdStyle">STYLE: Persian 6/8</span>
        <span id="lcdNote">NOTE: --</span>
      </div>
    </div>

    <!-- انتخاب ساز (Voices) -->
    <div class="control-group">
      <span class="group-label">ساز:</span>
      <select id="voiceSelect" class="y-select gold">
        <option value="cfx_piano">🎹 پیانو رویال (Yamaha CFX Grand)</option>
        <option value="santoor">🎼 سنتور ایرانی (Persian Santoor)</option>
        <option value="strings">🎻 ویولن و ارکستر زهی (Cinema Strings)</option>
        <option value="sax">🎷 ساکسیفون تنور (Sweet! Tenor Sax)</option>
        <option value="accordion">🪗 آکاردئون فرانسوی/ایرانی (Accordion)</option>
        <option value="organ">🎹 ارگ جاز و کلیسایی (Vintage Organ)</option>
        <option value="guitar">🎸 گیتار اسپانیش (Nylon Guitar)</option>
        <option value="synth">⚡ سینت‌سایزر شاد مجلسی (Lead Synth)</option>
      </select>
    </div>

    <!-- انتخاب موزیک پیش‌فرض ایرانی و خارجی -->
    <div class="control-group">
      <span class="group-label">آهنگ‌ها:</span>
      <select id="songSelect" class="y-select cyan">
        <optgroup label="🇮🇷 آهنگ‌های ایرانی">
          <option value="soltan">🇮🇷 سلطان قلب‌ها (عارف)</option>
          <option value="goldoon">🇮🇷 گل گلدون من (سیمین غانم)</option>
          <option value="janemaryam">🇮🇷 جان مریم (محمد نوری)</option>
          <option value="elahenaz">🇮🇷 الهه ناز (غلامحسین بنان)</option>
          <option value="persian68">🇮🇷 رقص شاد ۶/۸ مجلسی ایرانی</option>
        </optgroup>
        <optgroup label="🌍 آهنگ‌های معروف خارجی">
          <option value="furelise">🌍 Für Elise (بتهوون)</option>
          <option value="bellaciao">🌍 Bella Ciao (بلا چاو - ایتالیایی)</option>
          <option value="godfather">🌍 The Godfather (پدرخوانده)</option>
          <option value="odetojoy">🌍 Ode to Joy (سمفونی نهم بتهوون)</option>
          <option value="mozart">🌍 Romance / Mozart Variation</option>
        </optgroup>
      </select>
      <button class="y-btn play-song" id="playSongBtn">▶ پخش آهنگ</button>
    </div>

    <!-- انتخاب ریتم و درام اتوماتیک -->
    <div class="control-group">
      <span class="group-label">ریتم:</span>
      <select id="styleSelect" class="y-select">
        <option value="persian68">🥁 ۶/۸ شاد ایرانی (Persian 6/8)</option>
        <option value="bandari">🔥 بندری (Bandari Groove)</option>
        <option value="waltz">💃 والس ۳/۴ (Slow Waltz)</option>
        <option value="pop8">🎵 پاپ ۸ بیت (8-Beat Pop)</option>
        <option value="dance">⚡ تکنو / دنس (Euro Dance)</option>
      </select>
      <button class="y-btn rhythm-btn" id="rhythmToggleBtn">شروع ریتم</button>
      <button class="y-btn fill-btn" id="fillInBtn">پاساژ (Fill-In)</button>
    </div>

    <!-- تنظیمات تمپو، اکو، ترنسپوز و گوی‌ها -->
    <div class="control-group">
      <div class="slider-box">
        <span>تمپو:</span>
        <input type="range" id="tempoSlider" min="65" max="175" value="115" />
      </div>
      <div class="slider-box">
        <span>اکو:</span>
        <input type="range" id="echoSlider" min="0" max="100" value="65" />
      </div>
      <button class="y-btn active-blue" id="sustainBtn">Sustain: روشن</button>
      <button class="y-btn" id="addOrbBtn">+ گوی</button>
      <button class="y-btn" id="clearScoreBtn">پاک کردن نت</button>
    </div>
  </div>

  <!-- بوم گرافیکی -->
  <canvas id="stage"></canvas>

  <!-- کلاویه‌های ۲۲تایی ارگ -->
  <div class="piano-wrapper" id="pianoBox">
    <div class="piano-keys" id="pianoKeysContainer"></div>

    // ۳. ساخت کلاویه‌ها در DOM
    const keysContainer = document.getElementById('pianoKeysContainer');
    const keyElements = {};
    let mouseHeldKey = null;

    function buildPianoDOM() {
      keysContainer.innerHTML = '';
      const isMobile = window.innerWidth <= 780;
      const whiteWidth = isMobile ? 34 : 50;
      const blackWidth = isMobile ? 20 : 30;

      function attachEvents(el, k) {
        el.addEventListener('pointerdown', e => {
          e.stopPropagation();
          el.releasePointerCapture?.(e.pointerId);
          mouseHeldKey = k;
          startNote(k, true, false);
        });
        el.addEventListener('pointerenter', e => {
          if (e.buttons === 1) {
            if (mouseHeldKey && mouseHeldKey.code !== k.code) stopNote(mouseHeldKey);
            mouseHeldKey = k;
            startNote(k, true, false);
          }
        });
        el.addEventListener('pointerup', () => {
          if (mouseHeldKey && mouseHeldKey.code === k.code) {
            stopNote(k);
            mouseHeldKey = null;
          }
        });
        el.addEventListener('pointerleave', e => {
          if (e.buttons === 1 && mouseHeldKey && mouseHeldKey.code === k.code) {
            stopNote(k);
            mouseHeldKey = null;
          }
        });
      }

      PIANO_NOTES.filter(k => !k.black).forEach(k => {
        const el = document.createElement('div');
        el.className = 'key-white';
        el.innerHTML = `<span class="k-shortcut">${k.label}</span><span class="k-note">${k.note}</span>`;
        attachEvents(el, k);
        keysContainer.appendChild(el);
        keyElements[k.code] = el;
      });

      PIANO_NOTES.filter(k => k.black).forEach(k => {
        const el = document.createElement('div');
        el.className = 'key-black';
        const leftPx = (k.afterW + 1) * whiteWidth - (blackWidth / 2);
        el.style.left = leftPx + 'px';
        el.innerHTML = `<span class="k-shortcut">${k.label}</span><span class="k-note">${k.note}</span>`;
        attachEvents(el, k);
        keysContainer.appendChild(el);
        keyElements[k.code] = el;
      });
    }

    window.addEventListener('pointerup', () => {
      if (mouseHeldKey) {
        stopNote(mouseHeldKey);
        mouseHeldKey = null;
      }
    });

    // ۴. موتور صوتی ارگ یاماها (۸ ساز تخصصی + ریتم‌ساز + اکو و تالار کنسرت)
    let audioCtx = null;
    let dryBus = null;
    let reverbSend = null;
    let echoSend = null;
    let echoFeedback = null;

    let currentVoice = 'cfx_piano';
    let currentStyle = 'persian68';
    let tempoBPM = 115;
    let echoAmount = 0.65;
    let sustainPedal = true;

    const activeVoices = {};
    const heldKeysSet = new Set();

    const VOICE_COLORS = {
      cfx_piano: '#f59e0b',
      santoor: '#fbbf24',
      strings: '#a855f7',
      sax: '#fb7185',
      accordion: '#34d399',
      organ: '#38bdf8',
      guitar: '#f97316',
      synth: '#ec4899'
    };

    function createHallImpulse(actx, duration = 3.5, decay = 2.4) {
      const rate = actx.sampleRate;
      const len = Math.floor(rate * duration);
      const buffer = actx.createBuffer(2, len, rate);
      for (let ch = 0; ch < 2; ch++) {
        const data = buffer.getChannelData(ch);
        for (let i = 0; i < len; i++) {
          const env = Math.pow(1 - i / len, decay);
          data[i] = (Math.random() * 2 - 1) * env * 0.45;
        }
      }
      return buffer;
    }

    function ensureAudioReady() {
      try {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioCtx();

          const comp = audioCtx.createDynamicsCompressor();
          comp.threshold.setValueAtTime(-14, audioCtx.currentTime);
          comp.ratio.setValueAtTime(3.5, audioCtx.currentTime);

          dryBus = audioCtx.createGain();
          dryBus.gain.value = 0.85;

          const conv = audioCtx.createConvolver();
          conv.buffer = createHallImpulse(audioCtx, 3.6, 2.3);

          reverbSend = audioCtx.createGain();
          reverbSend.gain.value = echoAmount * 0.65;

          const delay = audioCtx.createDelay(2.0);
          delay.delayTime.value = 0.27;

          echoFeedback = audioCtx.createGain();
          echoFeedback.gain.value = echoAmount * 0.36;

          const echoFilter = audioCtx.createBiquadFilter();
          echoFilter.type = 'lowpass';
          echoFilter.frequency.value = 2400;

          echoSend = audioCtx.createGain();
          echoSend.gain.value = echoAmount * 0.35;

          dryBus.connect(comp);
          dryBus.connect(reverbSend);
          reverbSend.connect(conv);
          conv.connect(comp);

          dryBus.connect(echoSend);
          echoSend.connect(echoFilter);
          echoFilter.connect(delay);
          delay.connect(echoFeedback);
          echoFeedback.connect(echoFilter);
          delay.connect(comp);

          comp.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {}
    }

    // سنتز ۸ ساز حرفه‌ای یاماها با کشش واقعی هنگام نگه داشتن دکمه
    function startNote(k, isHeldByUser = true, isAutoPlay = false) {
      try {
        ensureAudioReady();
        if (!audioCtx) return;

        if (isHeldByUser && !isAutoPlay && heldKeysSet.has(k.code)) return;

        if (activeVoices[k.code]) {
          fadeOutVoice(activeVoices[k.code], 0.05);
        }

        const el = keyElements[k.code];
        if (isHeldByUser && !isAutoPlay) {
          heldKeysSet.add(k.code);
          if (el) el.classList.add('playing');
        } else if (el) {
          const cls = isAutoPlay ? 'auto-playing' : 'playing';
          el.classList.add(cls);
          setTimeout(() => {
            if (!heldKeysSet.has(k.code)) el.classList.remove(cls);
          }, 220);
        }

        document.getElementById('lcdNote').textContent = `NOTE: ${k.note}`;

        const now = audioCtx.currentTime;
        const freq = k.freq;
        const voiceGain = audioCtx.createGain();
        const oscillators = [];
        let maxHold = 12.0;

        if (currentVoice === 'cfx_piano') {
          // ۱. پیانو رویال یاماها CFX
          voiceGain.gain.setValueAtTime(0.0001, now);
          voiceGain.gain.linearRampToValueAtTime(0.32, now + 0.008);
          voiceGain.gain.exponentialRampToValueAtTime(0.18, now + 0.4);
          voiceGain.gain.exponentialRampToValueAtTime(0.0008, now + 13.0);

          const lp = audioCtx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(Math.min(freq * 9.5, 14000), now);
          lp.frequency.exponentialRampToValueAtTime(Math.max(freq * 1.8, 450), now + 10.0);
          voiceGain.connect(lp);
          lp.connect(dryBus);

          [-1.5, 0, 1.5].forEach((det, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = idx === 1 ? 'triangle' : 'sine';
            o.frequency.setValueAtTime(freq, now);
            o.detune.setValueAtTime(det, now);
            g.gain.value = idx === 1 ? 0.55 : 0.35;
            o.connect(g);
            g.connect(voiceGain);
            o.start(now);
            o.stop(now + 13.5);
            oscillators.push(o);
          });

          [2, 3, 4, 5].forEach(n => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(freq * n, now);
            g.gain.setValueAtTime(0.35 / n, now);
            g.gain.exponentialRampToValueAtTime(0.0005, now + 6.0 / n);
            o.connect(g);
            g.connect(voiceGain);
            o.start(now);
            o.stop(now + 6.5 / n);
            oscillators.push(o);
          });

        } else if (currentVoice === 'santoor') {
          // ۲. سنتور ایرانی (چهار مضراب با طنین سیم‌های برنجی/فولادی)
          voiceGain.gain.setValueAtTime(0.0001, now);
          voiceGain.gain.linearRampToValueAtTime(0.34, now + 0.004);
          voiceGain.gain.exponentialRampToValueAtTime(0.12, now + 0.35);
          voiceGain.gain.exponentialRampToValueAtTime(0.0008, now + 7.5);

          const bp = audioCtx.createBiquadFilter();
          bp.type = 'peaking';
          bp.frequency.value = freq * 3;
          bp.gain.value = 6;
          voiceGain.connect(bp);
          bp.connect(dryBus);

          [-2.2, 2.2].forEach(det => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, now);
            o.detune.setValueAtTime(det, now);
            g.gain.value = 0.24;
            o.connect(g);
            g.connect(voiceGain);
            o.start(now);
            o.stop(now + 8.0);
            oscillators.push(o);
          });

          // صدای ضربه مضراب چوبی سنتور
          const mOsc = audioCtx.createOscillator();
          const mGain = audioCtx.createGain();
          mOsc.type = 'triangle';
          mOsc.frequency.setValueAtTime(freq * 6, now);
          mOsc.frequency.exponentialRampToValueAtTime(freq * 2, now + 0.018);
          mGain.gain.setValueAtTime(0.25, now);
          mGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
          mOsc.connect(mGain);
          mGain.connect(dryBus);
          mOsc.start(now);
          mOsc.stop(now + 0.025);

        } else if (currentVoice === 'strings') {
          // ۳. ویولن و ارکستر زهی با کشش بی‌نهایت تا زمانی که دکمه را نگه دارید
          maxHold = 30.0;
          voiceGain.gain.setValueAtTime(0.0001, now);
          voiceGain.gain.linearRampToValueAtTime(0.26, now + 0.09); // حمله نرم آرشه ویولن
          voiceGain.gain.setValueAtTime(0.26, now + 0.1);

          const lp = audioCtx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = Math.min(freq * 5.5, 6500);
          voiceGain.connect(lp);
          lp.connect(dryBus);

          [-7, 0, 7].forEach(det => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, now);
            o.detune.setValueAtTime(det, now);
            g.gain.value = 0.24;
            o.connect(g);
            g.connect(voiceGain);
            o.start(now);
            o.stop(now + maxHold);
            oscillators.push(o);
          });

        } else if (currentVoice === 'sax') {
          // ۴. ساکسیفون تنور با ویبراتوی طبیعی
          maxHold = 25.0;
          voiceGain.gain.setValueAtTime(0.0001, now);
          voiceGain.gain.linearRampToValueAtTime(0.30, now + 0.045);

          const bp = audioCtx.createBiquadFilter();
          bp.type = 'lowpass';
          bp.frequency.setValueAtTime(freq * 4.2, now);
          bp.Q.value = 2.4;
          voiceGain.connect(bp);
          bp.connect(dryBus);

          const o1 = audioCtx.createOscillator();
          const o2 = audioCtx.createOscillator();
          o1.type = 'sawtooth';
          o2.type = 'square';
          o1.frequency.setValueAtTime(freq, now);
          o2.frequency.setValueAtTime(freq, now);

          // ویبراتوی ساکسیفون (LFO)
          const lfo = audioCtx.createOscillator();
          const lfoGain = audioCtx.createGain();
          lfo.frequency.value = 5.5;
          lfoGain.gain.value = 4.5;
          lfo.connect(lfoGain);
          lfoGain.connect(o1.frequency);
          lfoGain.connect(o2.frequency);
          lfo.start(now);
          lfo.stop(now + maxHold);

          const g1 = audioCtx.createGain();
          const g2 = audioCtx.createGain();
          g1.gain.value = 0.35;
          g2.gain.value = 0.22;
          o1.connect(g1);
          o2.connect(g2);
          g1.connect(voiceGain);
          g2.connect(voiceGain);
          o1.start(now);
          o2.start(now);
          o1.stop(now + maxHold);
          o2.stop(now + maxHold);
          oscillators.push(o1, o2, lfo);

        } else if (currentVoice === 'accordion') {
          // ۵. آکاردئون فرانسوی / ایرانی (Musette)
          maxHold = 25.0;
          voiceGain.gain.setValueAtTime(0.0001, now);
          voiceGain.gain.linearRampToValueAtTime(0.28, now + 0.03);

          const lp = audioCtx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 3800;
          voiceGain.connect(lp);
          lp.connect(dryBus);

          [-10, 0, 10].forEach((det, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = idx === 1 ? 'square' : 'sawtooth';
            o.frequency.setValueAtTime(freq, now);
            o.detune.setValueAtTime(det, now);
            g.gain.value = 0.24;
            o.connect(g);
            g.connect(voiceGain);
            o.start(now);
            o.stop(now + maxHold);
            oscillators.push(o);
          });

        } else if (currentVoice === 'organ') {
          // ۶. ارگ جاز و کلیسایی یاماها (Drawbar Organ)
          maxHold = 30.0;
          voiceGain.gain.setValueAtTime(0.0001, now);
          voiceGain.gain.linearRampToValueAtTime(0.28, now + 0.015);
          voiceGain.connect(dryBus);

          [0.5, 1, 1.5, 2, 3, 4].forEach((mult, idx) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(freq * mult, now);
            const amps = [0.35, 0.55, 0.25, 0.35, 0.18, 0.15];
            g.gain.value = amps[idx];
            o.connect(g);
            g.connect(voiceGain);
            o.start(now);
            o.stop(now + maxHold);
            oscillators.push(o);
          });

        } else if (currentVoice === 'guitar') {
          // ۷. گیتار کلاسیک اسپانیش
          voiceGain.gain.setValueAtTime(0.0001, now);
          voiceGain.gain.linearRampToValueAtTime(0.35, now + 0.006);
          voiceGain.gain.exponentialRampToValueAtTime(0.12, now + 0.3);
          voiceGain.gain.exponentialRampToValueAtTime(0.0008, now + 6.5);

          const lp = audioCtx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(freq * 6, now);
          lp.frequency.exponentialRampToValueAtTime(freq * 1.4, now + 2.5);
          voiceGain.connect(lp);
          lp.connect(dryBus);

          const o1 = audioCtx.createOscillator();
          const o2 = audioCtx.createOscillator();
          o1.type = 'triangle';
          o2.type = 'sawtooth';
          o1.frequency.setValueAtTime(freq, now);
          o2.frequency.setValueAtTime(freq * 2, now);
          const g2 = audioCtx.createGain();
          g2.gain.setValueAtTime(0.25, now);
          g2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          o1.connect(voiceGain);
          o2.connect(g2);
          g2.connect(voiceGain);
          o1.start(now);
          o2.start(now);
          o1.stop(now + 6.8);
          o2.stop(now + 0.7);
          oscillators.push(o1, o2);

        } else if (currentVoice === 'synth') {
          // ۸. سینت‌سایزر لید شاد مجلسی
          maxHold = 25.0;
          voiceGain.gain.setValueAtTime(0.0001, now);
          voiceGain.gain.linearRampToValueAtTime(0.28, now + 0.012);

          const lp = audioCtx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.setValueAtTime(freq * 9, now);
          lp.Q.value = 3.2;
          voiceGain.connect(lp);
          lp.connect(dryBus);

          [-8, 8].forEach(det => {
            const o = audioCtx.createOscillator();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, now);
            o.detune.setValueAtTime(det, now);
            const g = audioCtx.createGain();
            g.gain.value = 0.3;
            o.connect(g);
            g.connect(voiceGain);
            o.start(now);
            o.stop(now + maxHold);
            oscillators.push(o);
          });
        }

        const noteColor = isAutoPlay ? '#10b981' : (VOICE_COLORS[currentVoice] || '#f59e0b');
        const scoreNoteObj = addSheetNote(k.note, k.step, k.sharp, noteColor, false, isHeldByUser);

        activeVoices[k.code] = {
          code: k.code,
          voiceGain,
          oscillators,
          scoreNote: scoreNoteObj
        };

        // ارتعاش سیم متناظر
        const sLine = stringLines.find(s => s.keyObj.code === k.code);
        if (sLine) {
          sLine.amp = 15;
          ripples.push({
            x: sLine.x,
            y: sLine.y2 - 18,
            r: 5,
            maxR: 32,
            color: noteColor,
            alpha: 0.9
          });
        }
      } catch (e) {}
    }

    function fadeOutVoice(voice, releaseTime = 0.35) {
      if (!voice || !audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const g = voice.voiceGain.gain;
        g.cancelScheduledValues(now);
        g.setValueAtTime(Math.max(g.value, 0.0001), now);
        g.exponentialRampToValueAtTime(0.0001, now + releaseTime);
        setTimeout(() => {
          voice.oscillators.forEach(o => {
            try { o.stop(); } catch (e) {}
          });
        }, releaseTime * 1000 + 60);
      } catch (e) {}
    }

    function stopNote(k) {
      heldKeysSet.delete(k.code);
      const el = keyElements[k.code];
      if (el) el.classList.remove('playing', 'auto-playing');

      const voice = activeVoices[k.code];
      if (voice) {
        if (voice.scoreNote) voice.scoreNote.beingHeld = false;
        const sustainedInstrument = ['strings', 'sax', 'accordion', 'organ', 'synth'].includes(currentVoice);
        const rel = sustainedInstrument
          ? (sustainPedal ? 0.85 : 0.22)
          : (sustainPedal ? 3.2 : 0.38);
        fadeOutVoice(voice, rel);
        delete activeVoices[k.code];
      }
    }

    // ۵. موتور درام و ریتم‌ساز اتوماتیک یاماها (Persian 6/8, Bandari, Waltz, Pop, Dance)
    function playPercussion(type) {
      try {
        ensureAudioReady();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'kick') {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(135, now);
          o.frequency.exponentialRampToValueAtTime(38, now + 0.14);
          g.gain.setValueAtTime(0.55, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          o.connect(g);
          g.connect(dryBus);
          o.start(now);
          o.stop(now + 0.34);
          if (drums[0]) drums[0].pulse = 1;
        } else if (type === 'snare') {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'triangle';
          o.frequency.setValueAtTime(210, now);
          o.frequency.exponentialRampToValueAtTime(90, now + 0.1);
          g.gain.setValueAtTime(0.32, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
          o.connect(g);
          g.connect(dryBus);
          o.start(now);
          o.stop(now + 0.15);
          if (drums[1]) drums[1].pulse = 1;
        } else if (type === 'tom') {
          // صدای تنبک / بک برای ریتم ۶/۸ و بندری
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(320, now);
          o.frequency.exponentialRampToValueAtTime(145, now + 0.08);
          g.gain.setValueAtTime(0.34, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
          o.connect(g);
          g.connect(dryBus);
          o.start(now);
          o.stop(now + 0.11);
          if (drums[1]) drums[1].pulse = 0.8;
        } else if (type === 'hihat') {
          const len = Math.floor(audioCtx.sampleRate * 0.05);
          const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          const hp = audioCtx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 6800;
          const g = audioCtx.createGain();
          g.gain.setValueAtTime(0.18, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          src.connect(hp);
          hp.connect(g);
          g.connect(dryBus);
          src.start(now);
          if (drums[2]) drums[2].pulse = 1;
        }
      } catch (e) {}
    }

    let rhythmTimer = null;
    let rhythmStep = 0;
    let rhythmRunning = false;

    const RHYTHM_PATTERNS = {
      persian68: [
        ['kick'], ['hihat'], ['tom'], ['snare'], ['hihat'], ['tom']
      ],
      bandari: [
        ['kick'], ['tom'], ['hihat', 'tom'], ['snare'], ['kick'], ['tom', 'snare']
      ],
      waltz: [
        ['kick'], ['hihat'], ['hihat'], ['kick'], ['snare'], ['hihat']
      ],
      pop8: [
        ['kick'], ['hihat'], ['snare'], ['hihat'], ['kick'], ['kick'], ['snare'], ['hihat']
      ],
      dance: [
        ['kick'], ['hihat'], ['kick', 'snare'], ['hihat'], ['kick'], ['hihat'], ['kick', 'snare'], ['tom']
      ]
    };

    function startRhythmEngine() {
      stopRhythmEngine();
      rhythmRunning = true;
      rhythmStep = 0;
      const btn = document.getElementById('rhythmToggleBtn');
      btn.textContent = 'توقف ریتم ■';
      btn.classList.add('active');

      function tick() {
        if (!rhythmRunning) return;
        const pat = RHYTHM_PATTERNS[currentStyle] || RHYTHM_PATTERNS.persian68;
        const hits = pat[rhythmStep % pat.length];
        hits.forEach(h => playPercussion(h));
        rhythmStep++;

        const stepMs = (60000 / tempoBPM) / 2;
        rhythmTimer = setTimeout(tick, stepMs);
      }
      tick();
    }

    function stopRhythmEngine() {
      rhythmRunning = false;
      if (rhythmTimer) clearTimeout(rhythmTimer);
      const btn = document.getElementById('rhythmToggleBtn');
      btn.textContent = 'شروع ریتم';
      btn.classList.remove('active');
    }

    // پاساژ درام حرفه‌ای (Fill-In)
    function triggerFillIn() {
      ensureAudioReady();
      document.getElementById('lcdStatus').textContent = '🥁 DRUM FILL-IN!';
      const seq = ['tom', 'tom', 'snare', 'tom', 'snare', 'kick', 'snare'];
      seq.forEach((hit, idx) => {
        setTimeout(() => playPercussion(hit), idx * 75);
      });
    }

    // ۶. سیستم پخش خودکار آهنگ‌های پیش‌فرض ایرانی و خارجی (Auto-Play Sequencer)
    let songPlaying = false;
    let songTimer = null;
    let songNoteIndex = 0;
    let currentAutoKey = null;

    function startAutoSong(songId) {
      stopAutoSong();
      const song = SONG_LIBRARY[songId];
      if (!song) return;

      // تنظیم خودکار ساز، ریتم و تمپوی پیشنهادی آهنگ
      currentVoice = song.voice;
      document.getElementById('voiceSelect').value = song.voice;

      currentStyle = song.style;
      document.getElementById('styleSelect').value = song.style;

      tempoBPM = song.tempo;
      document.getElementById('tempoSlider').value = song.tempo;
      updateLCDInfo();

      songPlaying = true;
      songNoteIndex = 0;

      const playBtn = document.getElementById('playSongBtn');
      playBtn.textContent = '■ توقف آهنگ';
      playBtn.classList.add('playing');
      document.getElementById('lcdStatus').textContent = `🎵 PLAYING: ${song.title}`;

      if (!rhythmRunning) startRhythmEngine();

      function playNextNote() {
        if (!songPlaying) return;

        if (currentAutoKey) {
          stopNote(currentAutoKey);
          currentAutoKey = null;
        }

        const item = song.notes[songNoteIndex];
        const noteName = item[0];
        const beats = item[1];

        const kObj = NOTE_BY_NAME[noteName];
        if (kObj) {
          currentAutoKey = kObj;
          startNote(kObj, true, true);
        }

        songNoteIndex = (songNoteIndex + 1) % song.notes.length;
        const durationMs = beats * (60000 / tempoBPM);

        // رها کردن کلاویه کمی قبل از نت بعدی برای طبیعی شدن جمله موسیقی
        setTimeout(() => {
          if (currentAutoKey && currentAutoKey.note === noteName) {
            stopNote(currentAutoKey);
          }
        }, Math.max(80, durationMs * 0.86));

        songTimer = setTimeout(playNextNote, durationMs);
      }

      playNextNote();
    }

    function stopAutoSong() {
      songPlaying = false;
      if (songTimer) clearTimeout(songTimer);
      if (currentAutoKey) {
        stopNote(currentAutoKey);
        currentAutoKey = null;
      }
      stopRhythmEngine();
      const playBtn = document.getElementById('playSongBtn');
      playBtn.textContent = '▶ پخش آهنگ';
      playBtn.classList.remove('playing');
      document.getElementById('lcdStatus').textContent = 'READY - SELECT A SONG OR PLAY';
    }

    function updateLCDInfo() {
      const vSel = document.getElementById('voiceSelect');
      const sSel = document.getElementById('styleSelect');
      document.getElementById('lcdVoice').textContent = `VOICE: ${vSel.options[vSel.selectedIndex].text.split('(')[0]}`;
      document.getElementById('lcdStyle').textContent = `STYLE: ${sSel.value.toUpperCase()}`;
      document.getElementById('lcdTempo').textContent = `TEMPO: ${tempoBPM}`;
    }

    // ۷. مدیریت بوم گرافیکی (سیم‌ها، درام‌ها، گوی‌ها و دفتر نت پایین صفحه)
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const pianoBox = document.getElementById('pianoBox');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let staffTop = height - 140;

    let stringLines = [];
    let drums = [];
    let orbs = [];
    let sheetNotes = [];
    let ripples = [];
    const stringCooldowns = {};

    function updateLayout() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      staffTop = height - 140;

      buildPianoDOM();

      const boxRect = pianoBox.getBoundingClientRect();
      const topLimit = 100;
      const bottomLimit = boxRect.top;

      stringLines = PIANO_NOTES.map(k => {
        const el = keyElements[k.code];
        const r = el ? el.getBoundingClientRect() : { left: width / 2, width: 40 };
        const cx = r.left + r.width / 2;
        return {
          keyObj: k,
          x: cx,
          y1: topLimit,
          y2: bottomLimit,
          amp: 0,
          vel: 0
        };
      });

      const midY = (topLimit + bottomLimit) * 0.54;
      drums = [
        { id: 'kick',  label: 'KICK',   x: Math.max(55, boxRect.left * 0.5), y: midY + 25, r: 32, color: '#fb7185', step: 0, pulse: 0 },
        { id: 'snare', label: 'TOM/SN', x: Math.max(55, boxRect.left * 0.5), y: midY - 48, r: 28, color: '#fbbf24', step: 4, pulse: 0 },
        { id: 'hihat', label: 'HI-HAT', x: Math.min(width - 55, boxRect.right + (width - boxRect.right) * 0.5), y: midY - 12, r: 29, color: '#34d399', step: 8, pulse: 0 }
      ];
    }

    function addSheetNote(label, step, sharp, color, isDrum, beingHeld = false) {
      const item = {
        x: width - 85,
        label,
        step,
        sharp,
        color,
        isDrum,
        beingHeld,
        holdLength: 0
      };
      sheetNotes.push(item);
      return item;
    }

    function spawnOrb(x, y) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      orbs.push({
        x: x ?? (width * 0.5),
        y: y ?? 145,
        vx: dir * (2.8 + Math.random() * 1.4),
        vy: 2.0 + Math.random() * 1.0,
        r: 7.5,
        trail: []
      });
    }

    // ۸. ورودی کیبورد کامپیوتر (سازگار با کیبورد فارسی و انگلیسی)
    window.addEventListener('keydown', e => {
      ensureAudioReady();
      if (e.repeat) return;

      if (e.code === 'Space') {
        e.preventDefault();
        sustainPedal = !sustainPedal;
        const btn = document.getElementById('sustainBtn');
        btn.textContent = `Sustain: ${sustainPedal ? 'روشن' : 'خاموش'}`;
        btn.classList.toggle('active-blue', sustainPedal);
        return;
      }

      const matched = PIANO_NOTES.find(k => k.code === e.code);
      if (matched) {
        startNote(matched, true, false);
      }
    });

    window.addEventListener('keyup', e => {
      const matched = PIANO_NOTES.find(k => k.code === e.code);
      if (matched) {
        stopNote(matched);
      }
    });

    // تعامل ماوس با سیم‌ها و درام‌ها
    let lastMouseX = 0;
    canvas.addEventListener('pointerdown', e => {
      ensureAudioReady();
      lastMouseX = e.clientX;
      for (const d of drums) {
        if (Math.hypot(e.clientX - d.x, e.clientY - d.y) <= d.r) {
          playPercussion(d.id);
          addSheetNote(d.label, d.step, false, d.color, true, false);
          return;
        }
      }
    });

    canvas.addEventListener('pointermove', e => {
      const x = e.clientX;
      const y = e.clientY;
      for (const s of stringLines) {
        if (y >= s.y1 && y <= s.y2) {
          if ((lastMouseX < s.x && x >= s.x) || (lastMouseX > s.x && x <= s.x)) {
            const now = performance.now();
            if (!stringCooldowns[s.keyObj.code] || now - stringCooldowns[s.keyObj.code] > 140) {
              stringCooldowns[s.keyObj.code] = now;
              startNote(s.keyObj, false, false);
            }
          }
        }
      }
      lastMouseX = x;
    });

    // رویداد دکمه‌های پنل ارگ یاماها
    document.getElementById('voiceSelect').addEventListener('change', e => {
      currentVoice = e.target.value;
      updateLCDInfo();
    });

    document.getElementById('styleSelect').addEventListener('change', e => {
      currentStyle = e.target.value;
      updateLCDInfo();
    });

    document.getElementById('songSelect').addEventListener('change', e => {
      if (songPlaying) {
        startAutoSong(e.target.value);
      }
    });

    document.getElementById('playSongBtn').addEventListener('click', () => {
      ensureAudioReady();
      if (songPlaying) {
        stopAutoSong();
      } else {
        const songId = document.getElementById('songSelect').value;
        startAutoSong(songId);
      }
    });

    document.getElementById('rhythmToggleBtn').addEventListener('click', () => {
      ensureAudioReady();
      if (rhythmRunning) stopRhythmEngine();
      else startRhythmEngine();
    });

    document.getElementById('fillInBtn').addEventListener('click', () => {
      triggerFillIn();
    });

    document.getElementById('tempoSlider').addEventListener('input', e => {
      tempoBPM = Number(e.target.value);
      updateLCDInfo();
    });

    document.getElementById('echoSlider').addEventListener('input', e => {
      echoAmount = Number(e.target.value) / 100;
      if (audioCtx && reverbSend && echoSend && echoFeedback) {
        reverbSend.gain.setTargetAtTime(echoAmount * 0.7, audioCtx.currentTime, 0.05);
        echoSend.gain.setTargetAtTime(echoAmount * 0.4, audioCtx.currentTime, 0.05);
        echoFeedback.gain.setTargetAtTime(echoAmount * 0.42, audioCtx.currentTime, 0.05);
      }
    });

    document.getElementById('sustainBtn').addEventListener('click', () => {
      sustainPedal = !sustainPedal;
      const btn = document.getElementById('sustainBtn');
      btn.textContent = `Sustain: ${sustainPedal ? 'روشن' : 'خاموش'}`;
      btn.classList.toggle('active-blue', sustainPedal);
    });

    document.getElementById('addOrbBtn').addEventListener('click', () => {
      ensureAudioReady();
      spawnOrb(width * (0.35 + Math.random() * 0.3), 135 + Math.random() * 50);
    });

    document.getElementById('clearScoreBtn').addEventListener('click', () => {
      sheetNotes = [];
    });

    window.addEventListener('resize', updateLayout);

    // ۹. حلقه اصلی انیمیشن و رندر زنده
    function animate() {
      ctx.clearRect(0, 0, width, height);
      const voiceColor = VOICE_COLORS[currentVoice] || '#f59e0b';
      const boxRect = pianoBox.getBoundingClientRect();
      const time = performance.now() * 0.035;

      // ۱. رسم سیم‌های بالای کلاویه‌ها
      for (const s of stringLines) {
        s.y2 = boxRect.top;
        const isHeld = heldKeysSet.has(s.keyObj.code) || (currentAutoKey && currentAutoKey.code === s.keyObj.code);

        if (isHeld) {
          s.amp = Math.sin(time * 1.8) * 8.5;
        } else {
          const force = -0.32 * s.amp;
          s.vel = (s.vel + force) * 0.88;
          s.amp += s.vel;
          if (Math.abs(s.amp) < 0.05) s.amp = 0;
        }

        const active = Math.abs(s.amp) > 0.4 || isHeld;
        const sColor = s.keyObj.black ? '#38bdf8' : voiceColor;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(s.x, s.y1);
        ctx.quadraticCurveTo(s.x + s.amp, (s.y1 + s.y2) * 0.5, s.x, s.y2);
        ctx.strokeStyle = active
          ? sColor
          : (s.keyObj.black ? 'rgba(56, 189, 248, 0.16)' : 'rgba(226, 232, 240, 0.22)');
        ctx.lineWidth = active ? 2.6 : 1.1;
        if (active) {
          ctx.shadowColor = sColor;
          ctx.shadowBlur = 12;
        }
        ctx.stroke();
        ctx.restore();
      }

      // ۲. رسم پدهای درام
      for (const d of drums) {
        d.pulse *= 0.85;
        const r = d.r + d.pulse * 8;
        ctx.save();
        ctx.beginPath();
        ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = d.color;
        ctx.stroke();

        ctx.fillStyle = '#f1f5f9';
        ctx.font = 'bold 9.5px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.label, d.x, d.y + 3.5);
        ctx.restore();
      }

      // ۳. گوی‌های متحرک
      const topWall = 100;
      const bottomWall = boxRect.top - 4;

      for (const orb of orbs) {
        const prevX = orb.x;
        orb.x += orb.vx;
        orb.y += orb.vy;

        if (orb.x - orb.r < 20 || orb.x + orb.r > width - 20) orb.vx *= -1;
        if (orb.y - orb.r < topWall) orb.vy = Math.abs(orb.vy);
        else if (orb.y + orb.r > bottomWall) orb.vy = -Math.abs(orb.vy);

        for (const s of stringLines) {
          if (orb.y >= s.y1 && orb.y <= s.y2) {
            if ((prevX < s.x && orb.x >= s.x) || (prevX > s.x && orb.x <= s.x)) {
              const now = performance.now();
              if (!stringCooldowns[s.keyObj.code] || now - stringCooldowns[s.keyObj.code] > 160) {
                stringCooldowns[s.keyObj.code] = now;
                startNote(s.keyObj, false, false);
              }
            }
          }
        }

        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fillStyle = '#fef08a';
        ctx.fill();
      }

      // ۴. امواج دایره‌ای
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rp = ripples[i];
        rp.r += (rp.maxR - rp.r) * 0.16;
        rp.alpha *= 0.87;
        ctx.save();
        ctx.strokeStyle = rp.color;
        ctx.globalAlpha = rp.alpha;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
        if (rp.alpha < 0.03) ripples.splice(i, 1);
      }

      // ۵. دفتر نت زنده در پایین صفحه
      ctx.fillStyle = '#080b12';
      ctx.fillRect(0, staffTop, width, height - staffTop);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
      ctx.beginPath();
      ctx.moveTo(0, staffTop);
      ctx.lineTo(width, staffTop);
      ctx.stroke();

      const lineSpacing = 12;
      const bottomLineY = staffTop + 88;

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
      ctx.lineWidth = 1;
      for (let l = 0; l < 5; l++) {
        const ly = bottomLineY - l * lineSpacing;
        ctx.beginPath();
        ctx.moveTo(35, ly);
        ctx.lineTo(width - 35, ly);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(226, 232, 240, 0.5)';
      ctx.font = '56px serif';
      ctx.textAlign = 'left';
      ctx.fillText('𝄞', 40, bottomLineY - 5);

      const halfStep = lineSpacing / 2;
      for (let i = sheetNotes.length - 1; i >= 0; i--) {
        const n = sheetNotes[i];
        n.x -= 1.7;
        if (n.beingHeld) n.holdLength += 1.7;

        const ny = bottomLineY - n.step * halfStep;

        if (n.step <= -2) {
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
          ctx.beginPath();
          ctx.moveTo(n.x - 10, bottomLineY + lineSpacing);
          ctx.lineTo(n.x + 10, bottomLineY + lineSpacing);
          ctx.stroke();
        }

        ctx.save();
        ctx.fillStyle = n.color;
        ctx.strokeStyle = n.color;

        if (n.holdLength > 2) {
          ctx.save();
          ctx.strokeStyle = n.color;
          ctx.globalAlpha = 0.45;
          ctx.lineWidth = 5.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(n.x, ny);
          ctx.lineTo(n.x + n.holdLength, ny);
          ctx.stroke();
          ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(n.x, ny, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 1.6;
        ctx.beginPath();
        if (n.step < 4) {
          ctx.moveTo(n.x + 5, ny);
          ctx.lineTo(n.x + 5, ny - 23);
        } else {
          ctx.moveTo(n.x - 5, ny);
          ctx.lineTo(n.x - 5, ny + 23);
        }
        ctx.stroke();

        if (n.sharp) {
          ctx.font = 'bold 11px sans-serif';
          ctx.fillText('#', n.x - 15, ny + 4);
        }

        ctx.font = 'bold 8.5px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(n.label, n.x, bottomLineY + 32);
        ctx.restore();

        if (n.x + n.holdLength < 85) sheetNotes.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('load', () => {
      updateLayout();
      updateLCDInfo();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
